name: ci
# Manual for now (Actions tab > ci > Run workflow). Once it has passed there, change this line to
# `on: [push, pull_request]` so every change is checked.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -m "not slow and not llm" -q
        env:
          QT_QPA_PLATFORM: offscreen
